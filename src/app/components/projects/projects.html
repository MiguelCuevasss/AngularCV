<section class="projects">

  <h2>My Projects</h2>

  <div *ngFor="let repo of repos" class="project-card">

    <h3>{{ repo.name }}</h3>

    <p>
      {{ repo.description || 'No description available' }}
    </p>

    <p class="stars">
      Stars: {{ repo.stargazers_count }}
    </p>

    <a [href]="repo.html_url" target="_blank">
      View Repository
    </a>

  </div>

</section>
