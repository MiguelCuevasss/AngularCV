<div id="Seccion Numero 2" class="row bg-gris p-4 rounded mb-4">

    <div class="col-md-4">

        <input
            type="text"
            class="form-control mb-2"
            placeholder="Buscar..."
            (keyup)="filtrarHabilidades($event)"
        />

        <h2>My Special Courses</h2>

        <ol>
            <li *ngFor="let course of coursesFiltrados">
                {{ course }}
            </li>
        </ol>

    </div>


    <div class="col-md-4">

        <h2>My Skills</h2>

        <ul>
            <li *ngFor="let skill of skillsFiltrados">
                {{ skill }}
            </li>
        </ul>

    </div>


    <div class="col-md-4">

        <h2>Achievements</h2>

        <ul>
            <li *ngFor="let achievement of achievementsFiltrados">
                {{ achievement }}
            </li>
        </ul>

    </div>

</div>

<router-outlet></router-outlet>
