<div id="Seccion Numero 3" class="row bg-azul p-4 rounded mb-4">
    <div class="col-12">
        <div id="educacion" class="text-center">
            <h2 class="mb-4">Education</h2>
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-7">
                    <table class="table table-bordered table-striped text-center">
                        <thead>
                            <tr>
                                <th>Year</th>
                                <th>Institution</th>
                                <th>Title</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let item of education">
                                <td>{{ item.year }}</td>
                                <td>{{ item.institution }}</td>
                                <td>{{ item.title }}</td>
                            </tr> 
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
